; Optional build check/example. Arduino IDE is the primary user workflow.
; Verify the physical board's flash/PSRAM settings before uploading.
[platformio]
src_dir = RoboNose_SensorTest
default_envs = s3_native_usb

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:s3_native_usb]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:s3_usb_uart]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
