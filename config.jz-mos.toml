# Sao chép thành config.toml, chỉnh theo dây thực tế. BCM17 đã xác định; cực tính TRIG vẫn phải xác nhận.
sample_hz = 1.0
fsync_interval_s = 5.0
baseline_s = 30.0
exposure_s = 60.0
recovery_s = 60.0
seed = 688

[hardware]
i2c_bus = 1
bme_address = 0x77
ads_address = 0x48
heater_c = 320
heater_ms = 150
temperature_oversampling = 8
humidity_oversampling = 2
pressure_oversampling = 4
ads_gain = 1.0
ads_data_rate = 128
mq135_channel = 0
mq3_channel = 1
mq135_divider_description = "Chưa xác nhận; dự kiến 10 kΩ/10 kΩ"
mq3_divider_description = "Chưa xác nhận; dự kiến 10 kΩ/10 kΩ"
# Chỉ thêm khi đã đo/xác nhận: AO = ADS voltage * hệ số.
# mq135_divider_factor = 2.0
# mq3_divider_factor = 2.0

[pump]
enabled = false
confirmed = false
gpio_bcm = 17 # JZ-MOS TRIG/PWM, chân vật lý 11
# active_high = true hoặc false, theo mạch đã xác nhận

[analysis]
min_baseline_samples = 3
baseline_epsilon = 1e-9
baseline_drift_pct = 5.0
recovery_tolerance_pct = 10.0
missing_fraction = 0.1
adc_limit_count = 32700
max_gap_s = 3.0


[stability]
window_s = 30.0
min_samples = 5
min_window_fraction = 0.8
max_gap_s = 3.0
max_invalid_fraction = 0.2
gas_epsilon_ohm = 1e-9
gas_pct_per_min = 5.0
gas_range_pct = 5.0
temperature_per_min = 0.3 # °C/phút
temperature_range = 0.2 # °C trong cửa sổ
humidity_per_min = 1.0 # điểm %RH/phút
humidity_range = 1.0 # điểm %RH trong cửa sổ
temperature_warning_c = 35.0 # cảnh báo, không tự bù nhiệt
